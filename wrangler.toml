name = "mailtea-send-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

# `mailtea-sdk` imports `crypto` — unprefixed — for its webhook-signature
# helpers, so the bundle needs Node built-ins even though the send path is pure
# fetch. An unprefixed built-in needs BOTH the flag below and a
# `compatibility_date` of 2024-09-23 or later; with an older date the build
# fails with `Could not resolve "crypto"` even though the flag is set.
compatibility_flags = ["nodejs_compat"]

# Plain, non-secret configuration. Secrets never belong here — `wrangler.toml`
# is committed. Set MAILTEA_API_KEY with `wrangler secret put MAILTEA_API_KEY`.
[vars]
MAILTEA_FROM = "Acme <hello@acme.com>"

# MAILTEA_API_BASE_URL is deliberately unset, so the SDK uses its default,
# https://api.mailtea.app.
